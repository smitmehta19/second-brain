[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mindpalace"
version = "1.0.0"
description = "Mind Palace — dump anything, AI organizes everything. $0/month."
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[all]>=21.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "yt-dlp>=2024.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "notion-client>=3.0,<4",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.8.0",
    "readability-lxml>=0.8.0",
    "Pillow>=10.0.0",
    "markdownify>=0.12.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0.0",
    "keybert>=0.8.0",
]
semantic-onnx = [
    "sentence-transformers>=3.0.0",
    "keybert>=0.8.0",
    "onnxruntime>=1.17.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[project.scripts]
mindpalace = "src.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
