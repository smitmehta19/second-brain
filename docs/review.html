<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Mind Palace — Daily Review</title>

<link rel="stylesheet" href="theme.css">

<style>
/* ── MAIN ── */
.main { max-width: 820px; margin: 0 auto; padding: 52px 32px 80px; position: relative; z-index: 2; }

.page-eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px;
}
.page-eyebrow::before {
  content: '§'; display: inline-block; margin-right: 10px;
  color: var(--accent); font-family: var(--font-display); font-style: italic;
}
.page-headline {
  font-family: var(--font-display);
  font-variation-settings: 'opsz' 144, 'wght' 350, 'SOFT' 50;
  font-size: clamp(36px, 5vw, 64px);
  line-height: 0.96; letter-spacing: -0.03em; color: var(--text-primary); margin-bottom: 10px;
}
.page-headline em {
  font-style: italic; color: var(--accent-2);
  font-variation-settings: 'opsz' 144, 'wght' 350, 'SOFT' 100, 'WONK' 1;
}
.page-sub {
  font-family: var(--font-display); font-variation-settings: 'opsz' 14, 'wght' 350;
  font-style: italic; font-size: 16px; color: var(--text-secondary);
  margin-bottom: 36px; padding-bottom: 26px; border-bottom: 1px solid var(--rule-2);
}

/* ── QUEUE META ── */
.queue-meta {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-bottom: 28px; flex-wrap: wrap;
}
.queue-count {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-muted);
}
.queue-count strong { color: var(--accent); font-weight: 600; }
.queue-progress {
  flex: 1; max-width: 240px; height: 3px; background: var(--ink-3); position: relative;
}
.queue-progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); transition: width 0.4s ease; }

/* ── CARD ── */
.review-card {
  position: relative;
  border: 1px solid var(--rule-2);
  background: rgba(7,16,26,0.6);
  padding: 32px 32px 28px;
  animation: cardIn 0.32s ease;
}
@keyframes cardIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes cardOut { to { opacity:0; transform:translateX(80px) scale(0.97); } }
.review-card::before, .review-card::after, .review-card .br-tr, .review-card .br-bl {
  content: ''; position: absolute; width: 11px; height: 11px;
  border: 1px solid var(--accent); opacity: 0.55;
}
.review-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.review-card::after  { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.review-card .br-tr  { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.review-card .br-bl  { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.review-card.leaving { animation: cardOut 0.28s ease forwards; }

.card-eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text-ghost); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.card-days { color: var(--text-muted); }

.card-title {
  font-family: var(--font-display);
  font-variation-settings: 'opsz' 72, 'wght' 400;
  font-size: clamp(22px, 3.5vw, 34px);
  line-height: 1.08; letter-spacing: -0.02em;
  color: var(--text-primary); margin-bottom: 16px;
}
.card-summary {
  font-family: var(--font-display);
  font-variation-settings: 'opsz' 14, 'wght' 300;
  font-size: 15px; font-style: italic;
  color: var(--text-secondary); line-height: 1.65;
  margin-bottom: 18px; padding-bottom: 18px;
  border-bottom: 1px dashed var(--rule-2);
}
.card-pills { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.pill {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.10em;
  padding: 3px 9px; border: 1px solid var(--rule-2); text-transform: uppercase;
}
.pill-domain { color: var(--accent); }
.pill-type { color: var(--text-muted); }
.pill-warn { color: var(--danger); border-color: rgba(255,120,71,0.3); cursor: help; }

.card-source {
  font-family: var(--font-mono); font-size: 12px; color: var(--text-ghost);
  margin-bottom: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-source a { color: var(--accent-2); }
.card-source a:hover { text-decoration: underline; }

/* ── ACTION BUTTONS (Keep + Trash) ── */
.card-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-review {
  flex: 1; min-width: 140px;
  font-family: var(--font-hud); font-weight: 600; font-size: 12px;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 14px 20px; border: 1px solid var(--rule-2);
  background: transparent; color: var(--text-muted);
  cursor: pointer; transition: all 0.18s; position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.btn-review:hover { border-color: var(--text-muted); color: var(--text-primary); }
.btn-review:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-review:disabled:hover { border-color: var(--rule-2); color: var(--text-muted); }
.btn-review .btn-label { font-size: 13px; }
.btn-review .btn-hint {
  font-family: var(--font-body); font-size: 12px; font-weight: 500;
  color: var(--text-ghost); letter-spacing: 0; text-transform: none;
}
.btn-keep {
  border-color: var(--accent) !important; color: var(--accent) !important;
  background: var(--accent-dim) !important;
}
.btn-keep:not(:disabled):hover {
  background: rgba(95,231,255,0.18) !important;
  box-shadow: 0 0 24px rgba(95,231,255,0.25);
}
.btn-keep:disabled {
  border-color: var(--rule-2) !important; color: var(--text-disabled) !important;
  background: transparent !important;
}
.btn-trash {
  border-color: rgba(255,120,71,0.3) !important; color: var(--danger) !important;
}
.btn-trash:hover { border-color: var(--danger) !important; background: rgba(255,120,71,0.08) !important; }
.btn-trash .btn-hint { color: var(--text-ghost); }

/* ── BUCKET CHIP STRIP (multi-select) ── */
.bucket-strip {
  display: flex; flex-wrap: wrap; gap: 7px;
  margin-bottom: 22px; padding-bottom: 20px;
  border-bottom: 1px dashed var(--rule-2);
}
.bucket-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border: 1px solid var(--rule-2); background: transparent;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.bucket-chip .bc-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.bucket-chip:hover { color: var(--text-primary); }
.bucket-chip.selected { color: var(--text-primary); font-weight: 500; background: rgba(95,231,255,0.05); }
.bucket-chip.custom::after {
  content: '*'; color: var(--warm); margin-left: 4px; font-weight: 700;
}
.bucket-chip-new {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border: 1px dashed var(--rule-3); background: transparent;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-ghost); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.bucket-chip-new:hover { color: var(--accent); border-color: var(--accent); }
.bucket-new-input {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 10px; border: 1px solid var(--accent); background: var(--ink-3);
}
.bucket-new-input input {
  background: none; border: none; outline: none;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.10em;
  color: var(--text-primary); width: 140px; text-transform: uppercase;
}
.bucket-new-input input::placeholder { color: var(--text-disabled); text-transform: none; letter-spacing: 0; }
.bucket-strip-label {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--text-ghost); margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
}
.bucket-strip-label .selected-count {
  font-weight: 600; color: var(--accent); letter-spacing: 0.10em;
}

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 80px 0; }
.empty-state .empty-glyph {
  font-family: var(--font-display); font-style: italic;
  font-variation-settings: 'opsz' 144, 'wght' 300;
  font-size: 56px; color: var(--text-disabled);
  display: block; margin-bottom: 16px;
}
.empty-state p {
  font-family: var(--font-display); font-style: italic;
  font-size: 19px; color: var(--text-muted);
}

/* ── LOADING ── */
.loading-state { text-align: center; padding: 60px 0; }
.loading-state p { font-family: var(--font-display); font-style: italic; color: var(--text-muted); font-size: 17px; }

@media (max-width: 600px) {
  .main { padding: 32px 16px 60px; }
  .review-card { padding: 22px 18px 20px; }
  .btn-review { min-width: 80px; padding: 10px; }
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a class="masthead-brand" href="index.html" title="Home">
      <span class="brand-mark">▣</span>
      <span class="brand-name">THE MIND <em>PALACE</em></span>
    </a>
    <nav class="masthead-nav">
      <a class="mast-link active" href="review.html">Review</a>
      <a class="mast-link" href="bucket.html">Buckets</a>
      <a class="mast-link" href="atlas.html">Atlas</a>
      <a class="mast-link" href="mindmap.html">Mindmap</a>
    </nav>
    <div class="credits-wrap">
      <button class="status-pill" id="creditsBtn" title="AI credits status">
        <span class="status-dot" id="creditsDot"></span>
        <span class="status-label">AI</span>
      </button>
      <div class="credits-drop bracketed" id="creditsDrop">
        <span class="br-tr"></span><span class="br-bl"></span>
        <div class="credits-label">&#9671; AI CREDITS · TODAY</div>
        <div id="creditsContent"><div style="color:var(--text-disabled);font-size:12px;letter-spacing:0.1em">Loading...</div></div>
        <div class="credits-footer">
          <span>Resets midnight UTC</span>
          <button onclick="fetchCredits()">Refresh</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="auth-bar" id="authBar">
  <span class="auth-bar-label">&#9671; AUTH REQUIRED</span>
  <input type="password" id="authInput" placeholder="Dashboard token" autocomplete="off">
  <button id="authSave">Save</button>
</div>

<div class="toast-wrap" id="toastWrap">
  <div class="toast"><span class="toast-dot"></span><span id="toastMsg">Save failed</span><button id="toastRetry">Retry</button></div>
</div>

<main class="main">
  <div class="page-eyebrow">Daily Review</div>
  <h1 class="page-headline"><em>Inbox</em> Queue</h1>
  <p class="page-sub">One at a time. Pick the buckets, keep or trash.</p>

  <div id="loading" class="loading-state"><p>Loading review queue...</p></div>
  <div id="queueMeta" class="queue-meta" style="display:none">
    <div class="queue-count"><strong id="queueRemaining">0</strong> notes to review</div>
    <div class="queue-progress"><div class="queue-progress-fill" id="progressFill"></div></div>
    <div class="queue-count" id="queueDone" style="color:var(--success)"></div>
  </div>
  <div id="cardArea"></div>
</main>

<script>
const API = '';
const IS_LOCAL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '');
let TOKEN = IS_LOCAL ? '' : (localStorage.getItem('dashboard_token') || '');
const REVIEW_WINDOW_DAYS = 7;

function showAuthBar() {
  const bar = document.getElementById('authBar');
  if (bar) bar.classList.add('open');
}
function hideAuthBar() {
  const bar = document.getElementById('authBar');
  if (bar) bar.classList.remove('open');
}
let _toastTimer = null;
function showToast(msg, retryFn) {
  const wrap = document.getElementById('toastWrap');
  const msgEl = document.getElementById('toastMsg');
  const btn = document.getElementById('toastRetry');
  if (!wrap) return;
  msgEl.textContent = msg;
  btn.style.display = retryFn ? '' : 'none';
  btn.onclick = () => { hideToast(); if (retryFn) retryFn(); };
  wrap.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(hideToast, 3500);
}
function hideToast() {
  const wrap = document.getElementById('toastWrap');
  if (wrap) wrap.classList.remove('show');
}
document.addEventListener('DOMContentLoaded', () => {
  const saveBtn = document.getElementById('authSave');
  const input = document.getElementById('authInput');
  if (saveBtn && input) {
    saveBtn.onclick = () => {
      const v = input.value.trim();
      if (!v) return;
      localStorage.setItem('dashboard_token', v);
      TOKEN = v;
      hideAuthBar();
      location.reload();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') saveBtn.click(); });
  }
});

// Canonical buckets — fallback if /api/buckets is unreachable.
const CANONICAL_BUCKETS = ['CAREER','WATCH-LONG','WATCH-SHORT','MAKE','SHOP','READ','INSPIRE','DUMP'];
const FALLBACK_PALETTE = {
  'CAREER':     '#4FA8E0',
  'WATCH-LONG': '#B280BA',
  'WATCH-SHORT':'#FF7847',
  'MAKE':       '#7CD66A',
  'SHOP':       '#FFB36A',
  'READ':       '#8FA8BB',
  'INSPIRE':    '#FFC857',
  'DUMP':       '#5A7185'
};

// Populated from /api/buckets at init; each entry {name,label,color,custom}.
let ALL_BUCKETS = [];

function bucketByName(name) {
  return ALL_BUCKETS.find(b => b.name === name);
}
function bucketColor(name) {
  const b = bucketByName(name);
  return (b && b.color) || FALLBACK_PALETTE[name] || '#8FA8BB';
}
function bucketLabel(name) {
  const b = bucketByName(name);
  if (b && b.label) return b.label;
  return name.split('-').map(p => p.charAt(0) + p.slice(1).toLowerCase()).join(' ');
}

function authHeaders() {
  return TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {};
}

let queue = [];
let totalCount = 0;
let doneCount = 0;

function daysAgo(isoStr) {
  if (!isoStr) return 0;
  return Math.floor((Date.now() - new Date(isoStr).getTime()) / 86400000);
}

async function loadBuckets() {
  try {
    const r = await fetch(API + '/api/buckets', { headers: authHeaders() });
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data) && data.length) {
        ALL_BUCKETS = data;
        return;
      }
    }
  } catch (_) {}
  // Fallback: synthesise canonical from FALLBACK_PALETTE.
  ALL_BUCKETS = CANONICAL_BUCKETS.map(name => ({
    name, label: bucketLabel(name), color: FALLBACK_PALETTE[name], custom: false,
  }));
}

async function createCustomBucket(name) {
  const r = await fetch(API + '/api/buckets', {
    method: 'POST',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  if (!r.ok) {
    let msg = 'Bucket create failed';
    try { const data = await r.json(); if (data.error) msg = data.error; } catch (_) {}
    throw new Error(msg);
  }
  const record = await r.json();
  ALL_BUCKETS.push({ ...record, custom: true });
  return record;
}

async function loadQueue() {
  try {
    const r = await fetch(API + '/api/review/queue', { headers: authHeaders() });
    if (r.status === 401) { showAuthBar(); queue = []; return; }
    if (r.ok) {
      queue = await r.json();
    } else {
      const nr = await fetch(API + '/api/notes', { headers: authHeaders() });
      if (nr.status === 401) { showAuthBar(); queue = []; return; }
      if (!nr.ok) { queue = []; return; }
      const allNotes = await nr.json();
      const cutoff = Date.now() - REVIEW_WINDOW_DAYS * 86400000;
      queue = allNotes.filter(n => {
        const t = new Date(n.created_at).getTime();
        return t >= cutoff && !n.reviewed_at;
      }).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    }
  } catch (_) {
    queue = [];
  }
  totalCount = queue.length;
  doneCount = 0;
}

function updateMeta() {
  const remaining = queue.length;
  document.getElementById('queueRemaining').textContent = remaining;
  if (totalCount > 0) {
    const pct = Math.round((doneCount / totalCount) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
  }
  if (doneCount > 0) {
    document.getElementById('queueDone').textContent = doneCount + ' done';
  }
}

function showEmpty() {
  const cta = doneCount > 0
    ? `<a class="btn-primary" href="bucket.html?from=review&n=${doneCount}" style="margin-top:18px;display:inline-block">Continue to Buckets &rarr;</a>`
    : `<a class="btn-primary" href="bucket.html" style="margin-top:18px;display:inline-block">Browse Buckets &rarr;</a>`;
  document.getElementById('cardArea').innerHTML = `
    <div class="empty-state">
      <span class="empty-glyph">&#8709;</span>
      <p><em>Inbox zero.</em></p>
      ${cta}
    </div>`;
  document.getElementById('queueMeta').style.display = 'none';
}

function renderNextCard() {
  if (queue.length === 0) { showEmpty(); return; }
  const n = queue[0];
  const area = document.getElementById('cardArea');

  const days = daysAgo(n.created_at);
  const daysLabel = days === 0 ? 'today' : days === 1 ? '1 day ago' : days + ' days ago';
  const domains = Array.isArray(n.domains) ? n.domains : (n.domains ? JSON.parse(n.domains) : []);
  const noteType = n.note_type || n.url_content_type || '';
  const summary = n.summary || '';
  const sourceUrl = n.source_url || '';
  const lowConfidence = n.extraction_confidence !== null && n.extraction_confidence !== undefined
    && n.extraction_confidence < 0.5;

  // Pre-select buckets from the note. AI-suggested buckets[] preferred,
  // else legacy single bucket, else default ["READ"].
  const incomingBuckets = Array.isArray(n.buckets) && n.buckets.length
    ? n.buckets.map(b => String(b).toUpperCase())
    : (n.bucket ? [String(n.bucket).toUpperCase()] : ['READ']);
  const selected = new Set(incomingBuckets.filter(b => bucketByName(b)));
  if (selected.size === 0) selected.add('READ');

  const card = document.createElement('div');
  card.className = 'review-card';
  card.innerHTML = `
    <span class="br-tr"></span><span class="br-bl"></span>
    <div class="card-eyebrow">
      <span>Note</span>
      <span class="card-days">${daysLabel}</span>
    </div>
    <h2 class="card-title">${escHtml(n.title || 'Untitled')}</h2>
    ${summary ? `<p class="card-summary">${escHtml(summary)}</p>` : ''}
    <div class="card-pills">
      ${domains.map(d => `<span class="pill pill-domain">${escHtml(d)}</span>`).join('')}
      ${noteType ? `<span class="pill pill-type">${escHtml(noteType)}</span>` : ''}
      ${lowConfidence ? `<span class="pill pill-warn" title="Extraction may be incomplete — send the URL again or use /reprocess in Telegram">&#9888; low quality extract</span>` : ''}
    </div>
    ${sourceUrl ? `<div class="card-source"><a href="${escAttr(sourceUrl)}" target="_blank" rel="noopener">${escHtml(sourceUrl.slice(0,80))}</a></div>` : ''}
    <div class="bucket-strip-label">
      <span>Buckets</span>
      <span class="selected-count" id="selectedCount"></span>
    </div>
    <div class="bucket-strip" id="bucketStrip"></div>
    <div class="card-actions">
      <button class="btn-review btn-keep" data-action="keep">
        <span class="btn-label">Keep</span>
        <span class="btn-hint">Save to selected buckets</span>
      </button>
      <button class="btn-review btn-trash" data-action="trash">
        <span class="btn-label">Trash</span>
        <span class="btn-hint">Delete — gone for good</span>
      </button>
    </div>
  `;

  area.innerHTML = '';
  area.appendChild(card);

  const bucketStrip = card.querySelector('#bucketStrip');
  const selCountEl = card.querySelector('#selectedCount');
  const keepBtn = card.querySelector('[data-action="keep"]');

  function renderStrip() {
    const chips = ALL_BUCKETS.map(b => {
      const isSel = selected.has(b.name);
      const customCls = b.custom ? ' custom' : '';
      const borderStyle = isSel ? `border-color:${b.color};` : '';
      const colorStyle = isSel ? `color:${b.color};` : '';
      return `<button class="bucket-chip${isSel ? ' selected' : ''}${customCls}" data-bchip="${escAttr(b.name)}" style="${borderStyle}${colorStyle}" type="button" aria-pressed="${isSel}">` +
        `<span class="bc-dot" style="background:${b.color};opacity:${isSel ? 1 : 0.45}"></span>` +
        escHtml(b.label || b.name) + `</button>`;
    }).join('');
    // +New bucket trigger
    const newTile = `<button class="bucket-chip-new" id="newBucketBtn" type="button" title="Create a new custom bucket">+ New bucket</button>`;
    bucketStrip.innerHTML = chips + newTile;
    selCountEl.textContent = selected.size + ' selected';
    keepBtn.disabled = selected.size === 0;
  }
  renderStrip();

  bucketStrip.addEventListener('click', async e => {
    const chip = e.target.closest('[data-bchip]');
    if (chip) {
      const name = chip.dataset.bchip;
      if (selected.has(name)) selected.delete(name); else selected.add(name);
      renderStrip();
      return;
    }
    const newBtn = e.target.closest('#newBucketBtn');
    if (newBtn) {
      openNewBucketInput();
    }
  });

  function openNewBucketInput() {
    const existing = bucketStrip.querySelector('.bucket-new-input');
    if (existing) { existing.querySelector('input').focus(); return; }
    const wrap = document.createElement('span');
    wrap.className = 'bucket-new-input';
    wrap.innerHTML = `<input type="text" placeholder="NEW-BUCKET" maxlength="16" autocomplete="off">`;
    const newBtn = bucketStrip.querySelector('#newBucketBtn');
    if (newBtn) newBtn.replaceWith(wrap);
    const input = wrap.querySelector('input');
    input.focus();
    input.addEventListener('input', () => {
      // Force uppercase + restrict to [A-Z0-9-]
      const cleaned = input.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
      if (cleaned !== input.value) input.value = cleaned;
    });
    input.addEventListener('keydown', async e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const name = input.value.trim();
        if (!name) return;
        try {
          const rec = await createCustomBucket(name);
          selected.add(rec.name);
          renderStrip();
        } catch (err) {
          showToast(err.message || 'Could not create bucket');
          renderStrip();
        }
      }
      if (e.key === 'Escape') renderStrip();
    });
    input.addEventListener('blur', () => {
      // Restore +New tile if user clicked away with no entry
      if (!input.value.trim()) renderStrip();
    });
  }

  const keyHandler = e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'k' || e.key === 'K') { if (!keepBtn.disabled) doKeep(n.id, Array.from(selected), card); }
    if (e.key === 'x' || e.key === 'X') doTrash(n.id, card);
  };
  document.addEventListener('keydown', keyHandler);

  keepBtn.onclick = () => doKeep(n.id, Array.from(selected), card);
  card.querySelector('[data-action="trash"]').onclick = () => doTrash(n.id, card);

  card._removeKeyHandler = () => document.removeEventListener('keydown', keyHandler);
}

async function doKeep(noteId, buckets, cardEl) {
  if (!buckets || buckets.length === 0) {
    showToast('Pick at least one bucket');
    return;
  }
  let persisted = false;
  let status = 0;
  try {
    const r = await fetch(API + '/api/notes/' + noteId + '/review', {
      method: 'POST',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ buckets }),
    });
    status = r.status;
    persisted = r.ok;
  } catch (_) { persisted = false; }

  if (!persisted) {
    if (status === 401) showAuthBar();
    showToast('Save failed — retry?', () => doKeep(noteId, buckets, cardEl));
    return;
  }
  await advance(cardEl);
}

async function doTrash(noteId, cardEl) {
  let persisted = false;
  let status = 0;
  try {
    const r = await fetch(API + '/api/notes/' + noteId, {
      method: 'DELETE',
      headers: authHeaders(),
    });
    status = r.status;
    persisted = r.ok;
  } catch (_) { persisted = false; }

  if (!persisted) {
    if (status === 401) showAuthBar();
    showToast('Delete failed — retry?', () => doTrash(noteId, cardEl));
    return;
  }
  await advance(cardEl);
}

async function advance(cardEl) {
  if (cardEl._removeKeyHandler) cardEl._removeKeyHandler();
  cardEl.classList.add('leaving');
  await new Promise(r => setTimeout(r, 260));
  queue.shift();
  doneCount++;
  updateMeta();
  renderNextCard();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;');
}

async function init() {
  await loadBuckets();
  await loadQueue();
  document.getElementById('loading').style.display = 'none';
  if (queue.length === 0) {
    showEmpty();
  } else {
    document.getElementById('queueMeta').style.display = 'flex';
    updateMeta();
    renderNextCard();
  }
}

init();
</script>
<script>
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href]');
  if(!a) return;
  var href = a.getAttribute('href');
  if(!href || href.startsWith('#') || href.startsWith('http') || a.target === '_blank') return;
  e.preventDefault();
  document.body.classList.add('leaving');
  setTimeout(function(){ window.location.href = href; }, 240);
});
</script>
